{% extends 'base.html' %}

{% block title %}Edit Student{% endblock %}

{% block content %}

<style>
    .edit-card {
        max-width: 500px;
        margin: 30px auto;
        padding: 30px;
        background: white;
        border: 1px solid #e8e8f0;
        border-radius: 14px;
    }

    .edit-card h2 {
        margin-bottom: 10px;
        color: #1e1b4b;
    }

    .edit-card p {
        color: #77758c;
        margin-bottom: 20px;
    }

    .edit-card form p {
        margin-bottom: 15px;
    }

    .edit-card input {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-sizing: border-box;
    }

    .save-btn {
        background: #6558d3;
        color: white;
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }

    .cancel-btn {
        color: #6558d3;
        text-decoration: none;
        margin-left: 10px;
    }
</style>

<div class="edit-card">

    <h2>Edit Student</h2>
    <p>Update student details below.</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="save-btn">Save Changes</button>

        <a href="{% url 'student_list' %}" class="cancel-btn">Cancel</a>
    </form>

</div>

{% endblock %}
